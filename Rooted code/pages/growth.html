<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/growth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Chicle&family=DynaPuff:wght@400..700&family=Sacramento&display=swap" rel="stylesheet">

    <title>Rooted - Growth</title>

</head>


<body>

    <main>

        <div class="growth-page">


            <!-- HEADER -->

            <header class="growth-header">

                <h1 id="plant-name">
                    Lettuce
                </h1>

                <p id="plant-status">
                    Growing
                </p>

            </header>



            <!-- PLANT INFORMATION -->

            <section class="plant-information">

                <div class="info-item">

                    <span>
                        Quantity
                    </span>

                    <strong id="plant-quantity">
                        5
                    </strong>

                </div>


                <div class="info-item">

                    <span>
                        Planted
                    </span>

                    <strong id="plant-date">
                        12 August 2026
                    </strong>

                </div>


                <div class="info-item">

                    <span>
                        Location
                    </span>

                    <strong id="plant-location">
                        Large pot
                    </strong>

                </div>

            </section>



            <!-- GROWTH -->

            <section class="growth-section">

                <div class="section-heading">

                    <p class="section-title">
                        GROWTH
                    </p>

                    <button type="button" id="add-update-button">
                        + Add update
                    </button>

                </div>


                <div id="growth-container">

                    <div class="empty-growth">

                        <p>
                            No growth updates yet.
                        </p>

                        <span>
                            Add an update whenever you notice something new.
                        </span>

                    </div>

                </div>

            </section>



        </div>

    </main>

    <script src="../js/growth.js"></script>

</body>

</html>
