<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Chicle&family=DynaPuff:wght@400..700&family=Sacramento&display=swap" rel="stylesheet">

    <title>Rooted - Dashboard</title>

</head>


<body>

    <main>

        <div class="dashboard">

            <header class="dashboard-header">

                <h1>
                    Rooted
                </h1>

            </header>


            <section class="greeting">

                <h2>
                    Good morning,
                </h2>

                <h2 id="user-name">
                    there.
                </h2>

                <p>
                    Here's a look at your garden.
                </p>

            </section>


            <section class="garden-summary">

                <p class="section-title">
                    MY GARDEN
                </p>

                <div class="garden-info">

                    <div>

                        <span id="plant-count">
                            0
                        </span>

                        <p>
                            plants
                        </p>

                    </div>


                    <button type="button" id="garden-button">
                        View garden →
                    </button>

                </div>

            </section>


            <section class="activity">

                <p class="section-title">
                    RECENT ACTIVITY
                </p>

                <p class="empty-message">
                    Nothing here yet.
                </p>

            </section>


            <button type="button" id="add-plant-button">
                + Add a plant
            </button>


        </div>

    </main>

    <script src="../js/dashboard.js"></script>

</body>

</html>
