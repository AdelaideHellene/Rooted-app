<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/growth-update.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Chicle&family=DynaPuff:wght@400..700&family=Sacramento&display=swap" rel="stylesheet">

    <title>Rooted - Growth Update</title>

</head>


<body>

    <main>

        <div class="update-page">

            <button type="button" id="back-button">
    ← Back
</button>


            <header class="update-header">

                <h1>
                    Add growth update
                </h1>

                <p>
                    Record something new about your plant.
                </p>

            </header>


            <form class="update-form">


                <div class="form-group">

                    <label for="update-date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="update-date"
                        required>

                </div>


                <div class="form-group">

                    <label for="update-change">
                        What changed?
                    </label>

                    <input
                        type="text"
                        id="update-change"
                        placeholder="e.g. New leaves appeared"
                        required>

                </div>


                <div class="form-group">

                    <label for="update-height">
                        Height
                    </label>

                    <input
                        type="number"
                        id="update-height"
                        placeholder="e.g. 12"
                        min="0"
                        step="0.1">

                    <span class="input-hint">
                        cm
                    </span>

                </div>


                <div class="form-group">

                    <label for="update-notes">
                        Notes
                    </label>

                    <textarea
                        id="update-notes"
                        placeholder="Anything you noticed..."></textarea>

                </div>

                <div class="form-group">

    <label for="update-photo">
        Photo
    </label>
<div class="photo-upload">

    <input
        type="file"
        id="update-photo"
        accept="image/*">

    <label for="update-photo">
        + Add photo
    </label>

</div>

<div id="photo-preview-container">

    <img id="photo-preview" alt="Selected plant photo">

</div>

</div>


                <button type="submit" id="save-update-button">
                    Save update
                </button>


            </form>


        </div>

    </main>


    <script type="module" src="../js/growth-update.js"></script>

</body>

</html>
