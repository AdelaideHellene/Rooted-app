<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/garden.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Chicle&family=DynaPuff:wght@400..700&family=Sacramento&display=swap" rel="stylesheet">

    <title>Rooted - My Garden</title>

</head>


<body>

    <main>

        <div class="garden-page">


            <!-- HEADER -->

            <header class="garden-header">

                <div>

                    <h1>
                        My Garden
                    </h1>

                    <p>
                        Keep track of everything you're growing.
                    </p>

                </div>


                <button type="button" id="add-plant-button">
                    + Add plant
                </button>

            </header>



            <!-- PLANT SECTION -->

            <section class="plants-section">

                <p class="section-title">
                    YOUR PLANTS
                </p>


                <!-- This will eventually be filled by JavaScript -->

                <div id="plants-container">

                    <div class="empty-garden">

                        <p>
                            Your garden is empty.
                        </p>

                        <span>
                            Add your first plant to get started.
                        </span>

                    </div>

                </div>

            </section>


        </div>

    </main>

    <script src="../js/garden.js"></script>

</body>

</html>
